name: Probar Reve

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probar-reve.yml"
      - "scripts/probar_reve.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Una petición a Reve
        env:
          REVE_API_KEY: ${{ secrets.REVE_API_KEY }}
        run: python3 scripts/probar_reve.py
